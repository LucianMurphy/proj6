version: '3'  # version of compose format 

services:

  brevets:
    build: ./brevets
    command: python -u app.py
    ports:
      - 5000:5000
    volumes:
      - ./brevets:/todo
    environment:
      - DB_HOST=db
    depends_on:
      - db
  laptop-service:
    build: ./laptop  
    volumes:
      - ./laptop:/usr/src/app 
    ports:
      - 5001:80  # host:container
    environment:
      - DB_HOST=db
    depends_on:
      - db
  website:
    image: php:apache  
    volumes:
      - ./website:/var/www/html 
    ports:
      - 5002:80  # host:container
    depends_on:
      - laptop-service  # website is not going to work unless laptop-service is running
  db:
    image: mongo:6